name: Atualizar apuração
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apuracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 atualizar_apuracao.py
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apuracao.json
          git diff --cached --quiet || (git commit -m "Atualiza apuração" && git push)
